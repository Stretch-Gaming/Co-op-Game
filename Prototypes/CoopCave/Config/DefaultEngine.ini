[/Script/EngineSettings.GameMapsSettings]
; Create this level once in the editor (see README step 4). It stays empty;
; the C++ cave builds itself when you press Play.
GameDefaultMap=/Game/Maps/Playground.Playground
EditorStartupMap=/Game/Maps/Playground.Playground
GlobalDefaultGameMode=/Script/CoopProto.CoopGameMode
; Split screen, side by side like Hazelight's games
bUseSplitscreen=True
TwoPlayerSplitscreenLayout=Vertical

[/Script/Engine.LocalPlayer]
; Keeps the camera from stretching when each player only gets half the screen
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV

[/Script/Engine.RendererSettings]
; Keep it light for consoles: no Lumen, no virtual shadow maps, fully dynamic lighting.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=False
; TAA instead of TSR: about 16 ms faster per frame on the Mac mini in split screen
r.AntiAliasingMethod=2
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[ConsoleVariables]
; Live tuning values you want to keep (see README section 6), e.g.
; coop.Boost.Up=1500
